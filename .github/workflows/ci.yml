name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall services src scripts app.py
      - name: Pytest
        run: pytest
      - name: Python evaluation harness
        run: |
          if [ -f index/chunks.json ] && [ -f index/knowledge_graph.json ]; then
            python scripts/evaluate_data_management.py
          else
            echo "Skipping evaluation harness: generated index files are not committed."
          fi
      - name: Release gate fixture
        run: python scripts/evaluate_release_gate.py --fixture --skip-external-gates
      - name: Python dependency scan
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies for MCP contracts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: MCP contract tests
        run: pnpm --filter @data-room-cited/mcp-server test
      - name: Voice API/UI build and credential-free tests
        run: pnpm voice:test
      - name: Voice API/UI lint and typecheck
        run: |
          pnpm --filter @data-room-cited/voice-api lint
          pnpm --filter @data-room-cited/voice-api typecheck
          pnpm --filter @data-room-cited/voice-web lint
          pnpm --filter @data-room-cited/voice-web typecheck
      - name: Install Chromium for mocked voice browser tests
        run: pnpm --filter @data-room-cited/voice-web exec playwright install --with-deps chromium
      - name: Voice browser acceptance tests (mocked services and microphone)
        run: pnpm voice:test:e2e
      - name: Node dependency scan
        run: pnpm audit --audit-level high

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build rag-core image
        run: docker build -f docker/rag-core.Dockerfile -t data-room-cited/rag-core:ci .
      - name: Build orchestrator image
        run: docker build -f docker/orchestrator.Dockerfile -t data-room-cited/orchestrator:ci .
      - name: Build web image
        run: docker build -f docker/web.Dockerfile -t data-room-cited/web:ci .
      - name: Build mcp-server image
        run: docker build -f apps/mcp-server/Dockerfile -t data-room-cited/mcp-server:ci .
